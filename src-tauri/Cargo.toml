[package]
name = "symb-mir"
version = "0.1.0"
description = "SYMB-MIR — mirror/reality camera companion"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = ["window-set-always-on-top"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
